server:
  port: 9999
spring:
  application:
    name: booking-engine-service

  datasource:
    url: jdbc:postgresql://localhost:9000/booking_engine
    username: postgres
#    password: ${DB_PASSWORD}
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

    sql:
      init:
        mode: always

logging:
  level:
    root: INFO
    com.booking.engine.booking_engine_service.LoggingTest: TRACE
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      file-name=pattern: logs/archive/booking-engine-%d{yyyy-MM-dd}-%i.log
      max-file-size: 1KB
      max-history: 1
      total-size-cap: 10KB

