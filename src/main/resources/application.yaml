server:
  port: 9999
spring:
  application:
    name: booking-engine-service

  datasource:
    url: jdbc:postgresql://localhost:9000/booking_engine
    username: postgres
#    password: ${DB_PASSWORD}
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

    sql:
      init:
        mode: always
